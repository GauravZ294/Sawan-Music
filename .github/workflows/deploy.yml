name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the deployed page serves the production bundle
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 24); do
            if page_html=$(curl -fsSL "${PAGE_URL}?workflow_run=${GITHUB_RUN_ID}&check=${attempt}") \
              && printf '%s' "$page_html" | grep -Eq 'src="\./assets/index-[^"]+\.js"' \
              && ! printf '%s' "$page_html" | grep -q '/src/main.tsx'; then
              echo "GitHub Pages is serving the Vite production bundle."
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not serve the built Vite bundle after deployment."
          exit 1
